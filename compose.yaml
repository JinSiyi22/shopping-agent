services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - redis_data:/data


  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      PRODUCT_DATA_PATH: data/products_real.json

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile

    restart: unless-stopped

    environment:
      DEMO_API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy


volumes:
  redis_data:
